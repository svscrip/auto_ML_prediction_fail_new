[project]
name = "auto-ml-prediction-machines-failures"
version = "1.0.0"
description = "MLOps pipeline for industrial machine failure prediction (Kaggle Playground Series S3E17)"
readme = "README.md"
requires-python = ">=3.11,<3.14"
authors = [
    { name = "Skripin Sergey" },
]
dependencies = [
    "pandas>=2.0.0",
    "numpy>=1.24.0",
    "scikit-learn>=1.3.0",
    "catboost>=1.2.0",
    "mlflow>=3.17.0",
    "matplotlib>=3.7.0",
    "seaborn>=0.13.0",
    "psutil>=5.9.0",
    "pyarrow>=14.0.0",
]

# The project is an application/ML pipeline, not a distributable library,
# so Poetry manages dependencies and the virtual environment only.
[tool.poetry]
package-mode = false

[tool.poetry.group.dev.dependencies]
pytest = ">=7.4.0"
pytest-cov = ">=5.0.0"
black = ">=24.3.0"
isort = ">=5.13.0"
flake8 = ">=7.0.0"
flake8-bugbear = ">=24.2.6"
pre-commit = ">=3.6.0"

# ─── Formatters ──────────────────────────────────────────────────────────────
[tool.black]
line-length = 88
target-version = ["py311"]

[tool.isort]
profile = "black"
line_length = 88
known_first_party = ["src"]

# ─── Testing ─────────────────────────────────────────────────────────────────
[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ['slow: full training smoke test (deselect with -m "not slow")']
addopts = "-m 'not slow'"

# ─── Coverage ────────────────────────────────────────────────────────────────
[tool.coverage.run]
source = ["src"]
omit = ["tests/*", "conftest.py"]

[tool.coverage.report]
show_missing = true
skip_covered = true
