schema_version: "1.0"
card_version: "1.0"
title: "Model Card: прогнозирование отказов промышленного оборудования"
language: ru
last_reviewed: "2026-10-24"
scope: >
  Исторический полный прогон на 136 114 строках после ETL. Основные таблицы
  с маркерами model-card генерируются из этого файла и JSON-снимка.
  Отдельная таблица ablation в разделе 7 берётся из feature_ablation;
  она не заменяет исторические метрики или основную модель.

sources:
  metrics_snapshot: artifacts/example_model_card_metrics.json
  smoke_monitoring: artifacts/example_monitoring_summary.json
  cv_baseline: reference-material/keis7-research/model_metadata.json
  inference_monitoring: artifacts/example_inference_monitoring.json
  outdated_metrics: artifacts/example_metrics.json
  dataset: keis7-main/train.csv
  feature_ablation: artifacts/example_feature_ablation.json

model_details:
  name: "Machine Failure Predictor"
  version: "1.0 (полный прогон)"
  task: "Бинарная классификация табличных данных"
  algorithm: "CatBoostClassifier"
  framework: "CatBoost 1.2.10, scikit-learn 1.9.1"
  owner: "Групповой учебный проект (main); доработка ветки yanshin — Яньшин А."
  artifact: artifacts/model.cbm
  mlflow_experiment: machine_failure_prediction
  target: "Machine failure: 1 — отказ, 0 — норма"
  features: 17
  categorical_features: ["Type", "TWF", "HDF", "PWF", "OSF", "RNF"]
  decision_threshold: 0.5
  training_command: "poetry run python -m src.train"
  metrics_command: >-
    poetry run python -m src.model_card
    --output artifacts/model_card_metrics.json
  card_command: "poetry run python -m src.model_card --write model_card.md"
  license_note: >
    Условия использования кода и Kaggle S3E17 проверяются отдельно;
    лицензия исходного AI4I 2020 не переносится автоматически на весь проект.

intended_use:
  summary: >
    Модель оценивает вероятность отказа единицы оборудования по данным
    телеметрии и предназначена для ранжирования оборудования по риску.
    Решение об обслуживании принимает человек; модель не управляет станком.
  primary_uses:
    - "Учебная классификация текущего состояния; раннее предупреждение пока не подтверждено."
    - "Приоритизация оборудования для планового технического обслуживания."
    - "Учебная демонстрация полного MLOps-цикла: ETL, обучение, мониторинг, модель-карта."
  primary_users:
    - "Инженеры по обслуживанию и надёжности оборудования."
    - "Аналитики данных и MLOps-инженеры, сопровождающие модель."
    - "Студенты и преподаватели, изучающие MLOps."
  out_of_scope:
    - "Автоматическое отключение или аварийная остановка оборудования."
    - "Определение конкретной причины отказа по одной вероятности модели."
    - "Применение к типам оборудования и режимам, не представленным в обучающем наборе Kaggle S3E17."
    - "Оценка стоимости ремонта, остаточного ресурса или срока службы."
  human_oversight: >
    Обязательна: вероятность отказа — это сигнал для инженера, а не
    диагностическое заключение. Ложноположительные срабатывания приводят
    к лишним проверкам, ложноотрицательные — к пропуску отказа.

factors:
  input_features:
    - "Air temperature [K]"
    - "Process temperature [K]"
    - "Rotational speed [rpm]"
    - "Torque [Nm]"
    - "Tool wear [min]"
    - "TWF, HDF, PWF, OSF, RNF — флаги режимов отказа"
    - "delta_temperature [K], Power [kW], air_mass, air_heat_power [kW], efficiency [%]"
    - "total_failures_cum — число флагов в отсортированном пакете, не временная история"
    - "Type — категориальный тип изделия (L/M/H)"
  sensitive_attributes: >
    Персональные данные и защищённые атрибуты в датасете отсутствуют.
  proxy_risks: >
    Type (L/M/H) может косвенно описывать класс оборудования и условия
    эксплуатации. Различия метрик между типами следует проверять при
    переносе модели на другой парк станков.
  evaluation_factors:
    - "Стратифицированное разбиение 80/20 по целевому признаку."
    - "Отдельные метрики по Type (L/M/H)."
    - "Отдельные метрики по зафиксированным режимам отказа."
    - "Сводка по порогам 0.10, 0.25, 0.50, 0.75, 0.90."

metrics:
  problem: "Бинарная классификация при сильном дисбалансе классов (≈1.58% отказов)."
  primary: "Recall при фиксированном пороге 0.5: полнота важнее точности, так как пропуск отказа дороже ложной тревоги."
  secondary:
    - "Precision, F1"
    - "ROC-AUC"
    - "Brier score, Log loss"
    - "ECE (expected calibration error, 10 равных бинов)"
  decision_threshold: 0.5
  threshold_policy: >
    Порог 0.5 зафиксирован в src/config.py (DECISION_THRESHOLD), логируется
    в MLflow и используется в src/train.py. Порог не подбирался под F1 или
    стоимость ошибок; таблица threshold_sweep показывает компромисс.
  full_run:
    rows: 27223
    roc_auc: 0.9701
    recall: 0.8628
    precision: 0.2773
    f1: 0.4197
    accuracy: 0.9623
    ece: 0.1772
  smoke_run:
    rows: 4987
    roc_auc: 0.9340
    recall: 0.7860
    precision: 0.3930
    f1: 0.5240
  cv_baseline:
    folds: 5
    roc_auc_mean: 0.9271
    roc_auc_std: 0.0066
    recall_mean: 0.8040
    recall_std: 0.0236
    precision_mean: 0.3640
    precision_std: 0.0119
    f1_mean: 0.5009
    f1_std: 0.0133
  notes: >
    Полный прогон и smoke-прогон — разные эксперименты: smoke использует
    подвыборку 5 000 строк и потому не сопоставим с полным прогоном напрямую.
    CV-базис взят из исследовательского ноутбука (reference-material) и
    приведён как ориентир, а не как метрика текущего артефакта.

evaluation_data:
  protocol: >
    Стратифицированное разбиение 80/20 с random_state=42. Валидационная
    часть используется для early stopping, поэтому независимым тестом не является.
    ETL и total_failures_cum выполняются до разбиения, создавая риск утечки.
  validation_rows: 27223
  validation_positives: 430
  validation_negatives: 26793
  validation_positive_rate: 0.0158
  source: keis7-main/train.csv
  smoke_rows: 4987
  inference_rows: 90954
  limitations: >
    Датасет Kaggle S3E17 синтетический и связан с AI4I 2020;
    это не исходные 10 000 записей UCI и не реальный парк станков. Валидация на нём
    не доказывает качество на реальном производстве.


training_data:
  dataset: "Kaggle Playground Series S3E17, файл keis7-main/train.csv"
  rows_raw: 136429
  rows_after_etl: 136114
  target_rate_raw: 0.0157
  target_rate_after_etl: 0.0158
  removed_rows: 315
  cleaning: >
    Удалены противоречивые строки, где Machine failure=0, но установлен
    хотя бы один флаг режима отказа (clean_contradictory_rows).
  target_definition: >
    Целевой признак взят из датасета. 101 отказ (23.5%) не имеет ни одного
    флага режима; остальные отказы сопровождаются флагами TWF/HDF/PWF/OSF/RNF.
  features_engineering:
    - "delta_temperature, Power, air_mass, air_heat_power, efficiency."
    - "total_failures_cum — накопленное число флагов в отсортированном пакете, не временная история; текущая строка исключена."
    - "Сортировка по Type, Product ID и Tool wear перед расчётом cumsum."
  class_imbalance: "Примерно 1 отказ на 62 наблюдения (1.58%)."
  leakage_risk: >
    Флаги TWF/HDF/PWF/OSF/RNF — это записанные причины/признаки уже
    произошедшего отказа, а не независимая телеметрия. Они входят в
    MODEL_FEATURES, поэтому модель фактически видит разметку режима отказа.
    Все отказы с флагами обнаружены с recall 1.0, а единственные пропуски —
    отказы без флагов. Метрики полного прогона поэтому завышены относительно
    сценария «предсказать отказ только по датчикам».

quantitative_analyses:
  headline: >
    На валидации ROC-AUC 0.9701 и recall 0.8628 при precision 0.2773.
    Высокий recall достигается ценой 967 ложноположительных срабатываний
    против 371 верного обнаружения.
  subgroup_findings: >
    Recall по Type: L — 0.883, M — 0.844, H — 0.667 (всего 24 отказа H,
    поэтому интервал неопределённости широкий). По режимам отказа все
    флагированные отказы обнаружены (recall 1.0), а отказы без флага —
    только в 41.6% случаев; они же дают все 59 пропущенных отказов.
  threshold_findings: >
    При пороге 0.5 модель помечает 4.9% наблюдений как отказы при
    фактической доле 1.58%. Порог 0.75 даёт precision 0.794 и recall 0.798,
    порог 0.90 — precision 0.988 и recall 0.742. Выбор порога должен
    определяться стоимостью ложной тревоги и пропуска, а не accuracy.
  calibration_findings: >
    ECE 0.177 и Brier 0.0487 указывают на заметное отклонение от идеальной
    калибровки. Вероятности нельзя без дополнительной калибровки (Platt,
    isotonic) интерпретировать как частоту отказов; для ранжирования
    ROC-AUC остаётся информативным.
  drift_findings: >
    PSI на test.csv относительно train.csv ниже 0.001 по всем пяти
    числовым признакам, статус stable. Это ожидаемо для одной и той же
    синтетической генерации и не является доказательством устойчивости
    к реальному дрейфу.
  monitoring_findings: >
    risk_level строится по квантилям: около 10% наблюдений без совпадений квантилей попадают
    в «Высокий» риск; при совпадениях доля может быть меньше независимо от абсолютной вероятности. Это ранжирование,
    а не калиброванная вероятность отказа.


ethical_considerations:
  personal_data: "Персональные данные не используются."
  safety: >
    Модель не является системой аварийной защиты. Ложноотрицательные
    срабатывания могут привести к незапланированному простою, поэтому
    предсказания должны дополняться регламентными проверками.
  automation_bias: >
    Инженер может чрезмерно доверять высокому risk_level. Интерфейс должен
    показывать вероятность, порог и известные ограничения модели.
  fairness: >
    Защищённые группы в данных отсутствуют. Различия по Type отражают
    состав парка и могут быть значимы при переносе модели.
  environmental: "Энергопотребление и углеродный след не измерялись."

caveats_and_recommendations:
  caveats:
    - "Флаги режимов отказа — утечка целевой информации; метрики завышены."
    - "Датасет синтетический, реальные отказы и режимы могут отличаться."
    - "Порог 0.5 не оптимизирован под стоимость ошибок."
    - "Калибровка слабая: ECE 0.177."
    - "Подгруппы H (24 отказа) и RNF (1 отказ) слишком малы для надёжных выводов."
    - "risk_level — квантильное ранжирование, а не вероятность."
    - "PSI на том же синтетическом датасете не подтверждает устойчивость к дрейфу."
  recommendations:
    - "Обучить и сравнить вариант без флагов TWF/HDF/PWF/OSF/RNF — это честная оценка предиктивной силы датчиков."
    - "Подобрать порог по матрице стоимости ошибок и зафиксировать его в DECISION_THRESHOLD."
    - "Добавить калибровку вероятностей и строить reliability diagram."
    - "Провести temporal validation: обучаться на ранних периодах, проверяться на поздних."
    - "Собрать реальные данные и пересчитать метрики на них."
    - "Добавить в мониторинг долю отказов без флагов и дрейф целевого признака."

render:
  type_labels:
    L: "L — вариант L"
    M: "M — вариант M"
    H: "H — вариант H"
  failure_mode_labels:
    TWF: "Tool Wear Failure — износ инструмента"
    HDF: "Heat Dissipation Failure — перегрев"
    PWF: "Power Failure — проблема питания"
    OSF: "Overstrain Failure — перегрузка"
    RNF: "Random Failure — случайный отказ"
    NO_FLAG: "Отказ без указанного режима"
