# Pre-commit hooks. Install once with `pre-commit install`, run manually with
# `pre-commit run --all-files`.
#
# Tool versions are pinned to the same releases as the Poetry dev group
# (pyproject.toml) so that local runs and CI produce identical results.
default_language_version:
  python: python3

# Third-party research material and raw datasets are not edited by hooks.
exclude: ^(reference-material/|keis7-main/)

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
        args: [--markdown-linebreak-ext=md]
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-toml
      - id: check-added-large-files
      - id: check-merge-conflict
      - id: detect-private-key

  - repo: https://github.com/psf/black-pre-commit-mirror
    rev: 26.5.1
    hooks:
      - id: black

  - repo: https://github.com/PyCQA/isort
    rev: 9.0.2
    hooks:
      - id: isort
        args: [--profile, black]

  - repo: https://github.com/PyCQA/flake8
    rev: 7.4.1
    hooks:
      - id: flake8
        additional_dependencies: [flake8-bugbear]
